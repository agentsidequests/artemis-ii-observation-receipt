<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 1247" width="720" height="1247"><title id="title">Different files, related observations</title><desc id="desc">Deterministic metadata canary, not an observed NASA sampler. Five seconds is a conditional relation, not a scene boundary. Zero crossings is only a declared-layer pass.</desc><rect width="720" height="1247" fill="#eff4f8"/><g font-family="Arial, sans-serif"><text x="38" y="65" font-size="43" fill="#182c43" font-weight="600" text-anchor="start">Different files, related</text><text x="38" y="127.35" font-size="43" fill="#182c43" font-weight="600" text-anchor="start">observations</text><text x="38" y="203.7" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Groups appearing in both training and</text><text x="38" y="244.29999999999998" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">test, under a constructed split. Zero</text><text x="38" y="284.9" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">is a pass only for the declared layer.</text><text x="38" y="343.5" font-size="32" fill="#182c43" font-weight="600" text-anchor="start">Product-ID split</text><text x="54" y="407.9" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Camera actions</text><text x="682" y="407.9" font-size="28" fill="#514496" font-weight="600" text-anchor="end">1,937 / 2,166</text><text x="54" y="451.9" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Five-second groups</text><text x="682" y="451.9" font-size="28" fill="#514496" font-weight="600" text-anchor="end">762 / 816</text><line x1="38" y1="495.9" x2="682" y2="495.9" stroke="#c9d5df" stroke-width="2"/><text x="38" y="549.9" font-size="32" fill="#182c43" font-weight="600" text-anchor="start">Action-ID split</text><text x="54" y="614.3" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Camera actions</text><text x="682" y="614.3" font-size="28" fill="#066b70" font-weight="600" text-anchor="end">0 / 2,166</text><text x="54" y="658.3" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Five-second groups</text><text x="682" y="658.3" font-size="28" fill="#514496" font-weight="600" text-anchor="end">157 / 816</text><line x1="38" y1="702.3" x2="682" y2="702.3" stroke="#c9d5df" stroke-width="2"/><text x="38" y="756.3" font-size="32" fill="#182c43" font-weight="600" text-anchor="start">Five-second-group split</text><text x="54" y="820.6999999999999" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Camera actions</text><text x="682" y="820.6999999999999" font-size="28" fill="#066b70" font-weight="600" text-anchor="end">0 / 2,166</text><text x="54" y="864.6999999999999" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Five-second groups</text><text x="682" y="864.6999999999999" font-size="28" fill="#066b70" font-weight="600" text-anchor="end">0 / 816</text><line x1="38" y1="908.6999999999999" x2="682" y2="908.6999999999999" stroke="#c9d5df" stroke-width="2"/><line x1="38" y1="972.6999999999999" x2="682" y2="972.6999999999999" stroke="#c9d5df" stroke-width="2"/><text x="38" y="1014.6999999999999" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Deterministic metadata canary, not an</text><text x="38" y="1055.3" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">observed NASA sampler. Five seconds is</text><text x="38" y="1095.8999999999999" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">a conditional relation, not a scene</text><text x="38" y="1136.4999999999998" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">boundary. Zero crossings is only a</text><text x="38" y="1177.0999999999997" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">declared-layer pass.</text></g></svg>
