<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 1247" width="720" height="1247"><title id="title">One Sunset, four counts</title><desc id="desc">Original frozen reconstruction, not certified physical counts or independent samples.</desc><rect width="720" height="1247" fill="#eff4f8"/><g font-family="Arial, sans-serif"><text x="38" y="65" font-size="43" fill="#182c43" font-weight="600" text-anchor="start">One Sunset, four counts</text><text x="38" y="141.35" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">The connected Sunset context, under</text><text x="38" y="181.95" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">the original frozen reconstruction.</text><circle cx="50" cy="255.54999999999998" r="8" fill="#066b70"/><line x1="50" y1="267.54999999999995" x2="50" y2="372.54999999999995" stroke="#c9d5df" stroke-width="3"/><line x1="50" y1="350.54999999999995" x2="43" y2="366.54999999999995" stroke="#c9d5df" stroke-width="2"/><line x1="50" y1="350.54999999999995" x2="50" y2="366.54999999999995" stroke="#c9d5df" stroke-width="2"/><line x1="50" y1="350.54999999999995" x2="57" y2="366.54999999999995" stroke="#c9d5df" stroke-width="2"/><text x="87" y="274.54999999999995" font-size="52" fill="#066b70" font-weight="600" text-anchor="start">1</text><text x="87" y="317.54999999999995" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Scheduled event</text><text x="87" y="357.54999999999995" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">One event is represented repeatedly.</text><circle cx="50" cy="436.15" r="8" fill="#514496"/><line x1="50" y1="448.15" x2="50" y2="553.15" stroke="#c9d5df" stroke-width="3"/><line x1="50" y1="531.15" x2="43" y2="547.15" stroke="#c9d5df" stroke-width="2"/><line x1="50" y1="531.15" x2="50" y2="547.15" stroke="#c9d5df" stroke-width="2"/><line x1="50" y1="531.15" x2="57" y2="547.15" stroke="#c9d5df" stroke-width="2"/><text x="87" y="455.15" font-size="52" fill="#514496" font-weight="600" text-anchor="start">286</text><text x="87" y="498.15" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Camera actions</text><text x="87" y="538.15" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Five exposure keys per action.</text><circle cx="50" cy="616.75" r="8" fill="#935122"/><line x1="50" y1="628.75" x2="50" y2="733.75" stroke="#c9d5df" stroke-width="3"/><line x1="50" y1="711.75" x2="43" y2="727.75" stroke="#c9d5df" stroke-width="2"/><line x1="50" y1="711.75" x2="50" y2="727.75" stroke="#c9d5df" stroke-width="2"/><line x1="50" y1="711.75" x2="57" y2="727.75" stroke="#c9d5df" stroke-width="2"/><text x="87" y="635.75" font-size="52" fill="#935122" font-weight="600" text-anchor="start">1,430</text><text x="87" y="678.75" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Capture keys</text><text x="87" y="718.75" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Three archived versions per key.</text><circle cx="50" cy="797.35" r="8" fill="#066b70"/><text x="87" y="816.35" font-size="52" fill="#066b70" font-weight="600" text-anchor="start">4,290</text><text x="87" y="859.35" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Archive products</text><text x="87" y="899.35" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">More records do not create more</text><text x="87" y="939.95" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">events.</text><line x1="38" y1="1013.5500000000001" x2="682" y2="1013.5500000000001" stroke="#c9d5df" stroke-width="2"/><text x="38" y="1055.5500000000002" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Original frozen reconstruction, not</text><text x="38" y="1096.15" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">certified physical counts or</text><text x="38" y="1136.75" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">independent samples. Branching is</text><text x="38" y="1177.35" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">schematic, not proportional area.</text></g></svg>
