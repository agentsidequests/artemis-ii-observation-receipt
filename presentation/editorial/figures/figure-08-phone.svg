<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 1582" width="720" height="1582"><title id="title">Add a task map, not a new archive</title><desc id="desc">Illustrative pilot, not an accepted PDS or OGC carrier. Membership can be zero, one or many; unmatched is an alternative, not a simultaneous mapped state.</desc><rect width="720" height="1582" fill="#eff4f8"/><g font-family="Arial, sans-serif"><text x="38" y="65" font-size="43" fill="#182c43" font-weight="600" text-anchor="start">Add a task map, not a new</text><text x="38" y="127.35" font-size="43" fill="#182c43" font-weight="600" text-anchor="start">archive</text><text x="38" y="203.7" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Different layers answer different</text><text x="38" y="244.29999999999998" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">questions. The proposed companion</text><text x="38" y="284.9" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">preserves the archive’s existing</text><text x="38" y="325.5" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">identity.</text><text x="38" y="384.1" font-size="32" fill="#066b70" font-weight="600" text-anchor="start">PDS4 archive</text><text x="38" y="432.1" font-size="32" fill="#4e6176" font-weight="400" text-anchor="start">Which product is this, and where</text><text x="38" y="478.5" font-size="32" fill="#4e6176" font-weight="400" text-anchor="start">did it come from?</text><line x1="38" y1="550.9" x2="682" y2="550.9" stroke="#c9d5df" stroke-width="2"/><text x="38" y="600.9" font-size="32" fill="#514496" font-weight="600" text-anchor="start">Training-data concepts</text><text x="38" y="648.9" font-size="32" fill="#4e6176" font-weight="400" text-anchor="start">What is the task, sample, label</text><text x="38" y="695.3" font-size="32" fill="#4e6176" font-weight="400" text-anchor="start">and split role?</text><line x1="38" y1="767.6999999999999" x2="682" y2="767.6999999999999" stroke="#c9d5df" stroke-width="2"/><text x="38" y="817.6999999999999" font-size="32" fill="#935122" font-weight="600" text-anchor="start">Task companion</text><text x="38" y="865.6999999999999" font-size="32" fill="#4e6176" font-weight="400" text-anchor="start">Which captures and actions are</text><text x="38" y="912.0999999999999" font-size="32" fill="#4e6176" font-weight="400" text-anchor="start">related, and what must stay</text><text x="38" y="958.4999999999999" font-size="32" fill="#4e6176" font-weight="400" text-anchor="start">together?</text><line x1="38" y1="1030.8999999999999" x2="682" y2="1030.8999999999999" stroke="#c9d5df" stroke-width="2"/><text x="38" y="1080.8999999999999" font-size="32" fill="#066b70" font-weight="600" text-anchor="start">Window memberships</text><text x="38" y="1128.8999999999999" font-size="32" fill="#4e6176" font-weight="400" text-anchor="start">Keep zero, one or many links; do</text><text x="38" y="1175.3" font-size="32" fill="#4e6176" font-weight="400" text-anchor="start">not force a single owner.</text><line x1="38" y1="1247.7" x2="682" y2="1247.7" stroke="#c9d5df" stroke-width="2"/><line x1="38" y1="1307.7" x2="682" y2="1307.7" stroke="#c9d5df" stroke-width="2"/><text x="38" y="1349.7" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Illustrative pilot, not an accepted</text><text x="38" y="1390.3" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">PDS or OGC carrier. Membership can be</text><text x="38" y="1430.8999999999999" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">zero, one or many; unmatched is an</text><text x="38" y="1471.4999999999998" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">alternative, not a simultaneous mapped</text><text x="38" y="1512.0999999999997" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">state.</text></g></svg>
