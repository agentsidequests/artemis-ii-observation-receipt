<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 937" width="1200" height="937"><title id="title">One Sunset, four counts</title><desc id="desc">Original frozen reconstruction, not certified physical counts or independent samples.</desc><rect width="1200" height="937" fill="#eff4f8"/><g font-family="Arial, sans-serif"><text x="58" y="65" font-size="45" fill="#182c43" font-weight="600" text-anchor="start">One Sunset, four counts</text><text x="58" y="144.25" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">The connected Sunset context, under the original frozen reconstruction.</text><circle cx="70" cy="210.6" r="8" fill="#066b70"/><line x1="70" y1="222.6" x2="70" y2="327.6" stroke="#c9d5df" stroke-width="3"/><line x1="70" y1="305.6" x2="63" y2="321.6" stroke="#c9d5df" stroke-width="2"/><line x1="70" y1="305.6" x2="70" y2="321.6" stroke="#c9d5df" stroke-width="2"/><line x1="70" y1="305.6" x2="77" y2="321.6" stroke="#c9d5df" stroke-width="2"/><text x="107" y="229.6" font-size="58" fill="#066b70" font-weight="600" text-anchor="start">1</text><text x="373" y="229.6" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Scheduled event</text><text x="373" y="272.6" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">One event is represented repeatedly.</text><circle cx="70" cy="358.95000000000005" r="8" fill="#514496"/><line x1="70" y1="370.95000000000005" x2="70" y2="475.95000000000005" stroke="#c9d5df" stroke-width="3"/><line x1="70" y1="453.95000000000005" x2="63" y2="469.95000000000005" stroke="#c9d5df" stroke-width="2"/><line x1="70" y1="453.95000000000005" x2="70" y2="469.95000000000005" stroke="#c9d5df" stroke-width="2"/><line x1="70" y1="453.95000000000005" x2="77" y2="469.95000000000005" stroke="#c9d5df" stroke-width="2"/><text x="107" y="377.95000000000005" font-size="58" fill="#514496" font-weight="600" text-anchor="start">286</text><text x="373" y="377.95000000000005" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Camera actions</text><text x="373" y="420.95000000000005" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Five exposure keys per action.</text><circle cx="70" cy="507.30000000000007" r="8" fill="#935122"/><line x1="70" y1="519.3000000000001" x2="70" y2="624.3000000000001" stroke="#c9d5df" stroke-width="3"/><line x1="70" y1="602.3000000000001" x2="63" y2="618.3000000000001" stroke="#c9d5df" stroke-width="2"/><line x1="70" y1="602.3000000000001" x2="70" y2="618.3000000000001" stroke="#c9d5df" stroke-width="2"/><line x1="70" y1="602.3000000000001" x2="77" y2="618.3000000000001" stroke="#c9d5df" stroke-width="2"/><text x="107" y="526.3000000000001" font-size="58" fill="#935122" font-weight="600" text-anchor="start">1,430</text><text x="373" y="526.3000000000001" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Capture keys</text><text x="373" y="569.3000000000001" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Three archived versions per key.</text><circle cx="70" cy="655.6500000000001" r="8" fill="#066b70"/><text x="107" y="674.6500000000001" font-size="58" fill="#066b70" font-weight="600" text-anchor="start">4,290</text><text x="373" y="674.6500000000001" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Archive products</text><text x="373" y="717.6500000000001" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">More records do not create more events.</text><line x1="58" y1="799.0000000000001" x2="1142" y2="799.0000000000001" stroke="#c9d5df" stroke-width="2"/><text x="58" y="841.0000000000001" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Original frozen reconstruction, not certified physical counts or independent</text><text x="58" y="874.3500000000001" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">samples. Branching is schematic, not proportional area.</text></g></svg>
