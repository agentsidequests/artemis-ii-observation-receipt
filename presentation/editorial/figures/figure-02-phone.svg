<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 1550" width="720" height="1550"><title id="title">A filter changes the answer</title><desc id="desc">Frozen metadata accounting. Not physical prevalence, model bias or observed pipeline behavior. Layer and action-carried sensitivities remain in the article.</desc><rect width="720" height="1550" fill="#eff4f8"/><g font-family="Arial, sans-serif"><text x="38" y="65" font-size="43" fill="#182c43" font-weight="600" text-anchor="start">A filter changes the</text><text x="38" y="127.35" font-size="43" fill="#182c43" font-weight="600" text-anchor="start">answer</text><text x="38" y="203.7" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Sunset share: first choose the</text><text x="38" y="244.29999999999998" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">population, then choose the counting</text><text x="38" y="284.9" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">unit.</text><text x="38" y="343.5" font-size="32" fill="#182c43" font-weight="600" text-anchor="start">Keep only filled-in target fields</text><text x="38" y="408.5" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">All target fields</text><text x="682" y="408.5" font-size="35" fill="#066b70" font-weight="600" text-anchor="end">20.418%</text><rect x="38" y="431.5" width="644" height="14" rx="7.0" fill="#dce5ec"/><rect x="38" y="431.5" width="131.4925059163818" height="14" rx="7.0" fill="#066b70"/><line x1="360.0" y1="422.5" x2="360.0" y2="454.5" stroke="#4e6176" stroke-width="2" stroke-dasharray="4 4"/><text x="38" y="482.5" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">1,553 / 7,606</text><text x="38" y="537.1" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Nonblank target fields</text><text x="682" y="537.1" font-size="35" fill="#066b70" font-weight="600" text-anchor="end">45.502%</text><rect x="38" y="560.1" width="644" height="14" rx="7.0" fill="#dce5ec"/><rect x="38" y="560.1" width="293.0360386756519" height="14" rx="7.0" fill="#066b70"/><line x1="360.0" y1="551.1" x2="360.0" y2="583.1" stroke="#4e6176" stroke-width="2" stroke-dasharray="4 4"/><text x="38" y="611.1" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">1,553 / 3,413</text><text x="38" y="665.7" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">0%</text><text x="682" y="665.7" font-size="28" fill="#4e6176" font-weight="400" text-anchor="end">100%</text><line x1="38" y1="697.7" x2="682" y2="697.7" stroke="#c9d5df" stroke-width="2"/><text x="38" y="738.7" font-size="32" fill="#182c43" font-weight="600" text-anchor="start">Inside that selected population</text><text x="38" y="799.7" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Actions</text><text x="682" y="799.7" font-size="35" fill="#066b70" font-weight="600" text-anchor="end">33.989%</text><rect x="38" y="822.7" width="644" height="14" rx="7.0" fill="#dce5ec"/><rect x="38" y="822.7" width="218.8896174863388" height="14" rx="7.0" fill="#066b70"/><line x1="360.0" y1="813.7" x2="360.0" y2="845.7" stroke="#4e6176" stroke-width="2" stroke-dasharray="4 4"/><text x="38" y="873.7" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Exposures</text><text x="682" y="873.7" font-size="35" fill="#514496" font-weight="600" text-anchor="end">45.502%</text><rect x="38" y="896.7" width="644" height="14" rx="7.0" fill="#dce5ec"/><rect x="38" y="896.7" width="293.0360386756519" height="14" rx="7.0" fill="#514496"/><line x1="360.0" y1="887.7" x2="360.0" y2="919.7" stroke="#4e6176" stroke-width="2" stroke-dasharray="4 4"/><text x="38" y="947.7" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Products</text><text x="682" y="947.7" font-size="35" fill="#935122" font-weight="600" text-anchor="end">45.502%</text><rect x="38" y="970.7" width="644" height="14" rx="7.0" fill="#dce5ec"/><rect x="38" y="970.7" width="293.0360386756519" height="14" rx="7.0" fill="#935122"/><line x1="360.0" y1="961.7" x2="360.0" y2="993.7" stroke="#4e6176" stroke-width="2" stroke-dasharray="4 4"/><text x="38" y="1021.7" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Bytes</text><text x="682" y="1021.7" font-size="35" fill="#066b70" font-weight="600" text-anchor="end">52.413%</text><rect x="38" y="1044.7" width="644" height="14" rx="7.0" fill="#dce5ec"/><rect x="38" y="1044.7" width="337.53878790969554" height="14" rx="7.0" fill="#066b70"/><line x1="360.0" y1="1035.7" x2="360.0" y2="1067.7" stroke="#4e6176" stroke-width="2" stroke-dasharray="4 4"/><text x="38" y="1095.7" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">0%</text><text x="682" y="1095.7" font-size="28" fill="#4e6176" font-weight="400" text-anchor="end">100%</text><line x1="38" y1="1153.7" x2="682" y2="1153.7" stroke="#c9d5df" stroke-width="2"/><text x="38" y="1195.7" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">All bars: 0–100%; dashed marker: 50%.</text><text x="38" y="1236.3" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">The byte majority is not present in</text><text x="38" y="1276.8999999999999" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">every representation layer. Frozen</text><text x="38" y="1317.4999999999998" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">metadata accounting. Not physical</text><text x="38" y="1358.0999999999997" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">prevalence, model bias or observed</text><text x="38" y="1398.6999999999996" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">pipeline behavior. Layer and</text><text x="38" y="1439.2999999999995" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">action-carried sensitivities remain in</text><text x="38" y="1479.8999999999994" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">the article.</text></g></svg>
