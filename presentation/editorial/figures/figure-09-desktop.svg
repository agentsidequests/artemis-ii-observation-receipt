<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 1560" width="1200" height="1560"><title id="title">Ready for which question?</title><desc id="desc">Six bounded task states. No global ready/unusable verdict or specialist approval.</desc><rect width="1200" height="1560" fill="#eff4f8"/><g font-family="Arial, sans-serif"><text x="58" y="65" font-size="45" fill="#182c43" font-weight="600" text-anchor="start">Ready for which question?</text><text x="58" y="144.25" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">A useful archive does not have one universal ready/not-ready state.</text><text x="58" y="195.6" font-size="27" fill="#182c43" font-weight="600" text-anchor="start">Retrieval audit</text><text x="58" y="246.75" font-size="27" fill="#066b70" font-weight="500" text-anchor="start">Supported now</text><text x="58" y="295.9" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Products, identities, bytes</text><line x1="58" y1="353.25" x2="1142" y2="353.25" stroke="#c9d5df" stroke-width="2"/><text x="58" y="398.25" font-size="27" fill="#182c43" font-weight="600" text-anchor="start">Representation study</text><text x="58" y="449.4" font-size="27" fill="#066b70" font-weight="500" text-anchor="start">Supported with limit</text><text x="58" y="498.54999999999995" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Keep sibling views together</text><line x1="58" y1="555.9" x2="1142" y2="555.9" stroke="#c9d5df" stroke-width="2"/><text x="58" y="600.9" font-size="27" fill="#182c43" font-weight="600" text-anchor="start">Within-event model</text><text x="58" y="652.05" font-size="27" fill="#514496" font-weight="500" text-anchor="start">Conditional</text><text x="58" y="701.1999999999999" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Freeze a deployment-shaped protocol</text><line x1="58" y1="758.55" x2="1142" y2="758.55" stroke="#c9d5df" stroke-width="2"/><text x="58" y="803.55" font-size="27" fill="#182c43" font-weight="600" text-anchor="start">Target classifier</text><text x="58" y="854.6999999999999" font-size="27" fill="#514496" font-weight="500" text-anchor="start">Label audit needed</text><text x="58" y="903.8499999999999" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">44.872% tagged; camera associated with tags</text><line x1="58" y1="961.1999999999999" x2="1142" y2="961.1999999999999" stroke="#c9d5df" stroke-width="2"/><text x="58" y="1006.1999999999999" font-size="27" fill="#182c43" font-weight="600" text-anchor="start">New-Sunset test</text><text x="58" y="1057.35" font-size="27" fill="#514496" font-weight="500" text-anchor="start">Second event needed</text><text x="58" y="1106.5" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">One scheduled event cannot test another</text><line x1="58" y1="1163.85" x2="1142" y2="1163.85" stroke="#c9d5df" stroke-width="2"/><text x="58" y="1208.85" font-size="27" fill="#182c43" font-weight="600" text-anchor="start">Color / photometry</text><text x="58" y="1260.0" font-size="27" fill="#514496" font-weight="500" text-anchor="start">Calibration needed</text><text x="58" y="1309.15" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Archived tiers alone are insufficient</text><line x1="58" y1="1366.5" x2="1142" y2="1366.5" stroke="#c9d5df" stroke-width="2"/><line x1="58" y1="1421.5" x2="1142" y2="1421.5" stroke="#c9d5df" stroke-width="2"/><text x="58" y="1463.5" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Six bounded task states. No global ready/unusable verdict or specialist</text><text x="58" y="1496.85" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">approval.</text></g></svg>
