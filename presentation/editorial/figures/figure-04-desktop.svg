<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 970" width="1200" height="970"><title id="title">Two windows, two winners</title><desc id="desc">Archive prominence, not scientific importance. The windows are the same; the units are not.</desc><rect width="1200" height="970" fill="#eff4f8"/><g font-family="Arial, sans-serif"><text x="58" y="65" font-size="45" fill="#182c43" font-weight="600" text-anchor="start">Two windows, two winners</text><text x="58" y="144.25" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Compare within each counting unit. Both panels describe the same two windows.</text><text x="58" y="195.6" font-size="27" fill="#182c43" font-weight="600" text-anchor="start">Count actions: Guided Discussion leads</text><text x="58" y="264.75" font-size="27" fill="#182c43" font-weight="500" text-anchor="start">Guided Discussion</text><text x="1142" y="264.75" font-size="30" fill="#066b70" font-weight="600" text-anchor="end">76</text><rect x="58" y="287.75" width="1084" height="17" rx="8.5" fill="#dce5ec"/><rect x="58" y="287.75" width="1029.8" height="17" rx="8.5" fill="#066b70"/><text x="58" y="334.75" font-size="27" fill="#182c43" font-weight="500" text-anchor="start">Earthset</text><text x="1142" y="334.75" font-size="30" fill="#514496" font-weight="600" text-anchor="end">60</text><rect x="58" y="357.75" width="1084" height="17" rx="8.5" fill="#dce5ec"/><rect x="58" y="357.75" width="813.0" height="17" rx="8.5" fill="#514496"/><text x="58" y="404.75" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">0</text><text x="1142" y="404.75" font-size="23" fill="#4e6176" font-weight="400" text-anchor="end">80</text><text x="58" y="467.75" font-size="27" fill="#182c43" font-weight="600" text-anchor="start">Count products: Earthset leads</text><text x="58" y="536.9" font-size="27" fill="#182c43" font-weight="500" text-anchor="start">Guided Discussion</text><text x="1142" y="536.9" font-size="30" fill="#066b70" font-weight="600" text-anchor="end">684</text><rect x="58" y="559.9" width="1084" height="17" rx="8.5" fill="#dce5ec"/><rect x="58" y="559.9" width="741.456" height="17" rx="8.5" fill="#066b70"/><text x="58" y="606.9" font-size="27" fill="#182c43" font-weight="500" text-anchor="start">Earthset</text><text x="1142" y="606.9" font-size="30" fill="#514496" font-weight="600" text-anchor="end">900</text><rect x="58" y="629.9" width="1084" height="17" rx="8.5" fill="#dce5ec"/><rect x="58" y="629.9" width="975.6" height="17" rx="8.5" fill="#514496"/><text x="58" y="676.9" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">0</text><text x="1142" y="676.9" font-size="23" fill="#4e6176" font-weight="400" text-anchor="end">1,000</text><text x="58" y="739.9" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Guided Discussion: three exposure keys per action, nine products. Earthset:</text><text x="58" y="773.25" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">five exposure keys, fifteen products.</text><line x1="58" y1="831.6" x2="1142" y2="831.6" stroke="#c9d5df" stroke-width="2"/><text x="58" y="873.6" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Archive prominence, not scientific importance. The windows are the same; the</text><text x="58" y="906.95" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">units are not.</text></g></svg>
