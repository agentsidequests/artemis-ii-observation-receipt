<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 1008" width="1200" height="1008"><title id="title">Different files, related observations</title><desc id="desc">Deterministic metadata canary, not an observed NASA sampler. Five seconds is a conditional relation, not a scene boundary. Zero crossings is only a declared-layer pass.</desc><rect width="1200" height="1008" fill="#eff4f8"/><g font-family="Arial, sans-serif"><text x="58" y="65" font-size="45" fill="#182c43" font-weight="600" text-anchor="start">Different files, related observations</text><text x="58" y="144.25" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Groups appearing in both training and test, under a constructed split. Zero is</text><text x="58" y="177.6" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">a pass only for the declared layer.</text><text x="58" y="228.95" font-size="27" fill="#182c43" font-weight="600" text-anchor="start">Product-ID split</text><text x="74" y="286.09999999999997" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Camera actions</text><text x="1142" y="286.09999999999997" font-size="23" fill="#514496" font-weight="600" text-anchor="end">1,937 / 2,166</text><text x="74" y="330.09999999999997" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Five-second groups</text><text x="1142" y="330.09999999999997" font-size="23" fill="#514496" font-weight="600" text-anchor="end">762 / 816</text><line x1="58" y1="374.09999999999997" x2="1142" y2="374.09999999999997" stroke="#c9d5df" stroke-width="2"/><text x="58" y="428.09999999999997" font-size="27" fill="#182c43" font-weight="600" text-anchor="start">Action-ID split</text><text x="74" y="485.24999999999994" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Camera actions</text><text x="1142" y="485.24999999999994" font-size="23" fill="#066b70" font-weight="600" text-anchor="end">0 / 2,166</text><text x="74" y="529.25" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Five-second groups</text><text x="1142" y="529.25" font-size="23" fill="#514496" font-weight="600" text-anchor="end">157 / 816</text><line x1="58" y1="573.25" x2="1142" y2="573.25" stroke="#c9d5df" stroke-width="2"/><text x="58" y="627.25" font-size="27" fill="#182c43" font-weight="600" text-anchor="start">Five-second-group split</text><text x="74" y="684.4" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Camera actions</text><text x="1142" y="684.4" font-size="23" fill="#066b70" font-weight="600" text-anchor="end">0 / 2,166</text><text x="74" y="728.4" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Five-second groups</text><text x="1142" y="728.4" font-size="23" fill="#066b70" font-weight="600" text-anchor="end">0 / 816</text><line x1="58" y1="772.4" x2="1142" y2="772.4" stroke="#c9d5df" stroke-width="2"/><line x1="58" y1="836.4" x2="1142" y2="836.4" stroke="#c9d5df" stroke-width="2"/><text x="58" y="878.4" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Deterministic metadata canary, not an observed NASA sampler. Five seconds is a</text><text x="58" y="911.75" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">conditional relation, not a scene boundary. Zero crossings is only a</text><text x="58" y="945.1" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">declared-layer pass.</text></g></svg>
