<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 1021" width="720" height="1021"><title id="title">Same context, different weight</title><desc id="desc">Action-count reference, not an independence baseline. Descriptive shares, not a sampler or model effect.</desc><rect width="720" height="1021" fill="#eff4f8"/><g font-family="Arial, sans-serif"><text x="38" y="65" font-size="43" fill="#182c43" font-weight="600" text-anchor="start">Same context, different</text><text x="38" y="127.35" font-size="43" fill="#182c43" font-weight="600" text-anchor="start">weight</text><text x="38" y="203.7" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Share of the whole reconstructed</text><text x="38" y="244.29999999999998" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">cohort assigned to the connected</text><text x="38" y="284.9" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Sunset context.</text><text x="38" y="343.5" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Camera actions</text><text x="682" y="343.5" font-size="35" fill="#066b70" font-weight="600" text-anchor="end">13.204%</text><rect x="38" y="366.5" width="644" height="14" rx="7.0" fill="#dce5ec"/><rect x="38" y="366.5" width="340.1366574330563" height="14" rx="7.0" fill="#066b70"/><text x="38" y="417.5" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Action-count reference</text><text x="38" y="472.1" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Archive products</text><text x="682" y="472.1" font-size="35" fill="#514496" font-weight="600" text-anchor="end">18.801%</text><rect x="38" y="495.1" width="644" height="14" rx="7.0" fill="#dce5ec"/><rect x="38" y="495.1" width="484.31238495924276" height="14" rx="7.0" fill="#514496"/><text x="38" y="546.1" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">1.424× action share</text><text x=