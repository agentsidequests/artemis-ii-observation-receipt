<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 1652" width="720" height="1652"><title id="title">How evenly is the archive spread?</title><desc id="desc">Nconcentration = 1 / sum(pᵢ²). Not effective sample size, independent events or a flight recommendation.</desc><rect width="720" height="1652" fill="#eff4f8"/><g font-family="Arial, sans-serif"><text x="38" y="65" font-size="43" fill="#182c43" font-weight="600" text-anchor="start">How evenly is the archive</text><text x="38" y="127.35" font-size="43" fill="#182c43" font-weight="600" text-anchor="start">spread?</text><text x="38" y="203.7" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Concentration-equivalent window units.</text><text x="38" y="244.29999999999998" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">This is an evenness index, not a count</text><text x="38" y="284.9" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">of independent events.</text><text x="38" y="343.5" font-size="32" fill="#182c43" font-weight="600" text-anchor="start">Original memberships</text><text x="38" y="414.9" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Actions</text><text x="682" y="414.9" font-size="35" fill="#066b70" font-weight="600" text-anchor="end">19.000 units</text><rect x="38" y="437.9" width="644" height="14" rx="7.0" fill="#dce5ec"/><rect x="38" y="437.9" width="339.88862401350366" height="14" rx="7.0" fill="#066b70"/><text x="38" y="488.9" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Products</text><text x="682" y="488.9" font-size="35" fill="#514496" font-weight="600" text-anchor="end">16.824 units</text><rect x="38" y="511.9" width="644" height="14" rx="7.0" fill="#dce5ec"/><rect x="38" y="511.9" width="300.9607732748734" height="14" rx="7.0" fill="#514496"/><text x="38" y="562.9" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Bytes</text><tex