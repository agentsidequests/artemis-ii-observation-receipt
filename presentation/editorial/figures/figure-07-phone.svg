<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 1658" width="720" height="1658"><title id="title">The crew changed how they watched</title><desc id="desc">Nonstationary opportunity. No prompt causation, one-to-one event mapping, detection probability or physical clustering is inferred.</desc><rect width="720" height="1658" fill="#eff4f8"/><g font-family="Arial, sans-serif"><text x="38" y="65" font-size="43" fill="#182c43" font-weight="600" text-anchor="start">The crew changed how they</text><text x="38" y="127.35" font-size="43" fill="#182c43" font-weight="600" text-anchor="start">watched</text><text x="38" y="203.7" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Retained transcript anchors, 7 April</text><text x="38" y="244.29999999999998" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">2026. Spacing shows sequence, not</text><text x="38" y="284.9" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">elapsed time.</text><circle cx="46" cy="334.5" r="8" fill="#514496"/><line x1="46" y1="348.5" x2="46" y2="456.5" stroke="#c9d5df" stroke-width="3"/><text x="77" y="343.5" font-size="30" fill="#182c43" font-weight="500" text-anchor="start">First report</text><text x="77" y="387.5" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">00:41:00.680 UTC</text><circle cx="46" cy="453.5" r="8" fill="#066b70"/><line x1="46" y1="467.5" x2="46" y2="575.5" stroke="#c9d5df" stroke-width="3"/><text x="77" y="462.5" font-size="30" fill="#182c43" font-weight="500" text-anchor="start">Search intent</text><text x="77" y="506.5" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">00:43:19.545 UTC</text><circle cx="46" cy="572.5" r="8" fill="#066b70"/><line x1="46" y1="586.5" x2="46" y2="694.5" stroke="#c9d5df" stroke-width="3"/><text x="77" y="581.5" font-size="30" fill="#182c43" font-weight="500" text-anchor="start">Display dimmed</text><text x="77" y=