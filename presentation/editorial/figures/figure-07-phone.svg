" font-weight="500" text-anchor="start">Last clear report</text><text x="77" y="1339.5" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">01:03:04.906 UTC</text><line x1="38" y1="1424.5" x2="682" y2="1424.5" stroke="#c9d5df" stroke-width="2"/><text x="38" y="1466.5" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Nonstationary opportunity. No prompt</text><text x="38" y="1507.1" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">causation, one-to-one event mapping,</text><text x="38" y="1547.6999999999998" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">detection probability or physical</text><text x="38" y="1588.2999999999997" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">clustering is inferred.</text></g></svg>
