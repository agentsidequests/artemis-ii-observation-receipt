<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 1242" width="720" height="1242"><title id="title">Two windows, two winners</title><desc id="desc">Archive prominence, not scientific importance. The windows are the same; the units are not.</desc><rect width="720" height="1242" fill="#eff4f8"/><g font-family="Arial, sans-serif"><text x="38" y="65" font-size="43" fill="#182c43" font-weight="600" text-anchor="start">Two windows, two winners</text><text x="38" y="141.35" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Compare within each counting unit.</text><text x="38" y="181.95" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Both panels describe the same two</text><text x="38" y="222.54999999999998" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">windows.</text><text x="38" y="281.15" font-size="32" fill="#182c43" font-weight="600" text-anchor="start">Count actions: Guided Discussion</text><text x="38" y="327.54999999999995" font-size="32" fill="#182c43" font-weight="600" text-anchor="start">leads</text><text x="38" y="403.94999999999993" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Guided Discussion</text><text x="682" y="403.94999999999993" font-size="35" fill="#066b70" font-weight="600" text-anchor="end">76</text><rect x="38" y="426.94999999999993" width="644" height="14" rx="7.0" fill="#dce5ec"/><rect x="38" y="426.94999999999993" width="611.8" height="14" rx="7.0" fill="#066b70"/><text x="38" y="477.94999999999993" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Earthset</text><text x="682" y="477.94999999999993" font-size="35" fill="#514496" font-weight="600" text-anchor="end">60</text><rect x="38" y="500.94999999999993" width="644" height="14" rx="7.0" fill="#dce5ec"/><rect x="38" y="500.94999999999993" width="483.0" height="14" rx="7.0" fill="#514496"/><text x="38" y="551.9499999999999" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">0</text><text x="682" y="551.9499999999999" font-size="28" fill="#4e6176" font-weight="400" text-anchor="end">80</text><text x="38" y="614.9499999999999" font-size="32" fill="#182c43" font-weight="600" text-anchor="start">Count products: Earthset leads</text><text x="38" y="691.3499999999999" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Guided Discussion</text><text x="682" y="691.3499999999999" font-size="35" fill="#066b70" font-weight="600" text-anchor="end">684</text><rect x="38" y="714.3499999999999" width="644" height="14" rx="7.0" fill="#dce5ec"/><rect x="38" y="714.3499999999999" width="440.496" height="14" rx="7.0" fill="#066b70"/><text x="38" y="765.3499999999999" font-size="32" fill="#182c43" font-weight="500" text-anchor="start">Earthset</text><text x="682" y="765.3499999999999" font-size="35" fill="#514496" font-weight="600" text-anchor="end">900</text><rect x="38" y="788.3499999999999" width="644" height="14" rx="7.0" fill="#dce5ec"/><rect x="38" y="788.3499999999999" width="579.6" height="14" rx="7.0" fill="#514496"/><text x="38" y="839.3499999999999" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">0</text><text x="682" y="839.3499999999999" font-size="28" fill="#4e6176" font-weight="400" text-anchor="end">1,000</text><text x="38" y="902.3499999999999" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Guided Discussion: three exposure keys</text><text x="38" y="942.9499999999999" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">per action, nine products. Earthset:</text><text x="38" y="983.55" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">five exposure keys, fifteen products.</text><line x1="38" y1="1049.1499999999999" x2="682" y2="1049.1499999999999" stroke="#c9d5df" stroke-width="2"/><text x="38" y="1091.1499999999999" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Archive prominence, not scientific</text><text x="38" y="1131.7499999999998" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">importance. The windows are the same;</text><text x="38" y="1172.3499999999997" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">the units are not.</text></g></svg>
