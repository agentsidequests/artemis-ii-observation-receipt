<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 1030" width="1200" height="1030"><title id="title">Add a task map, not a new archive</title><desc id="desc">Illustrative pilot, not an accepted PDS or OGC carrier. Membership can be zero, one or many; unmatched is an alternative, not a simultaneous mapped state.</desc><rect width="1200" height="1030" fill="#eff4f8"/><g font-family="Arial, sans-serif"><text x="58" y="65" font-size="45" fill="#182c43" font-weight="600" text-anchor="start">Add a task map, not a new archive</text><text x="58" y="144.25" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Different layers answer different questions. The proposed companion preserves</text><text x="58" y="177.6" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">the archive’s existing identity.</text><text x="58" y="228.95" font-size="27" fill="#066b70" font-weight="600" text-anchor="start">PDS4 archive</text><text x="58" y="276.95" font-size="27" fill="#4e6176" font-weight="400" text-anchor="start">Which product is this, and where did it come from?</text><line x1="58" y1="342.09999999999997" x2="1142" y2="342.09999999999997" stroke="#c9d5df" stroke-width="2"/><text x="58" y="392.09999999999997" font-size="27" fill="#514496" font-weight="600" text-anchor="start">Training-data concepts</text><text x="58" y="440.09999999999997" font-size="27" fill="#4e6176" font-weight="400" text-anchor="start">What is the task, sample, label and split role?</text><line x1="58" y1="505.24999999999994" x2="1142" y2="505.24999999999994" stroke="#c9d5df" stroke-width="2"/><text x="58" y="555.25" font-size="27" fill="#935122" font-weight="600" text-anchor="start">Task companion</text><text x="58" y="603.25" font-size="27" fill="#4e6176" font-weight="400" text-anchor="start">Which captures and actions are related, and what must stay together?</text><line x1="58" y1="668.4" x2="1142" y2="668.4" stroke="#c9d5df" stroke-width="2"/><text x="58" y="718.4" font-size="27" fill="#066b70" font-weight="600" text-anchor="start">Window memberships</text><text x="58" y="766.4" font-size="27" fill="#4e6176" font-weight="400" text-anchor="start">Keep zero, one or many links; do not force a single owner.</text><line x1="58" y1="831.55" x2="1142" y2="831.55" stroke="#c9d5df" stroke-width="2"/><line x1="58" y1="891.55" x2="1142" y2="891.55" stroke="#c9d5df" stroke-width="2"/><text x="58" y="933.55" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">Illustrative pilot, not an accepted PDS or OGC carrier. Membership can be zero,</text><text x="58" y="966.9" font-size="23" fill="#4e6176" font-weight="400" text-anchor="start">one or many; unmatched is an alternative, not a simultaneous mapped state.</text></g></svg>
