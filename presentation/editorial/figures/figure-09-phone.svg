<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 1871" width="720" height="1871"><title id="title">Ready for which question?</title><desc id="desc">Six bounded task states. No global ready/unusable verdict or specialist approval.</desc><rect width="720" height="1871" fill="#eff4f8"/><g font-family="Arial, sans-serif"><text x="38" y="65" font-size="43" fill="#182c43" font-weight="600" text-anchor="start">Ready for which question?</text><text x="38" y="141.35" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">A useful archive does not have one</text><text x="38" y="181.95" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">universal ready/not-ready state.</text><text x="38" y="240.54999999999998" font-size="32" fill="#182c43" font-weight="600" text-anchor="start">Retrieval audit</text><text x="38" y="298.95" font-size="32" fill="#066b70" font-weight="500" text-anchor="start">Supported now</text><text x="38" y="355.34999999999997" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Products, identities, bytes</text><line x1="38" y1="419.95" x2="682" y2="419.95" stroke="#c9d5df" stroke-width="2"/><text x="38" y="464.95" font-size="32" fill="#182c43" font-weight="600" text-anchor="start">Representation study</text><text x="38" y="523.3499999999999" font-size="32" fill="#066b70" font-weight="500" text-anchor="start">Supported with limit</text><text x="38" y="579.7499999999999" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Keep sibling views together</text><line x1="38" y1="644.3499999999999" x2="682" y2="644.3499999999999" stroke="#c9d5df" stroke-width="2"/><text x="38" y="689.3499999999999" font-size="32" fill="#182c43" font-weight="600" text-anchor="start">Within-event model</text><text x="38" y="747.7499999999999" font-size="32" fill="#514496" font-weight="500" text-anchor="start">Conditional</text><text x="38" y="804.1499999999999" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Freeze a deployment-shaped protocol</text><line x1="38" y1="868.7499999999999" x2="682" y2="868.7499999999999" stroke="#c9d5df" stroke-width="2"/><text x="38" y="913.7499999999999" font-size="32" fill="#182c43" font-weight="600" text-anchor="start">Target classifier</text><text x="38" y="972.1499999999999" font-size="32" fill="#514496" font-weight="500" text-anchor="start">Label audit needed</text><text x="38" y="1028.5499999999997" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">44.872% tagged; camera associated with</text><text x="38" y="1069.1499999999996" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">tags</text><line x1="38" y1="1133.7499999999995" x2="682" y2="1133.7499999999995" stroke="#c9d5df" stroke-width="2"/><text x="38" y="1178.7499999999995" font-size="32" fill="#182c43" font-weight="600" text-anchor="start">New-Sunset test</text><text x="38" y="1237.1499999999996" font-size="32" fill="#514496" font-weight="500" text-anchor="start">Second event needed</text><text x="38" y="1293.5499999999997" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">One scheduled event cannot test</text><text x="38" y="1334.1499999999996" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">another</text><line x1="38" y1="1398.7499999999995" x2="682" y2="1398.7499999999995" stroke="#c9d5df" stroke-width="2"/><text x="38" y="1443.7499999999995" font-size="32" fill="#182c43" font-weight="600" text-anchor="start">Color / photometry</text><text x="38" y="1502.1499999999996" font-size="32" fill="#514496" font-weight="500" text-anchor="start">Calibration needed</text><text x="38" y="1558.5499999999997" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Archived tiers alone are insufficient</text><line x1="38" y1="1623.1499999999996" x2="682" y2="1623.1499999999996" stroke="#c9d5df" stroke-width="2"/><line x1="38" y1="1678.1499999999996" x2="682" y2="1678.1499999999996" stroke="#c9d5df" stroke-width="2"/><text x="38" y="1720.1499999999996" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">Six bounded task states. No global</text><text x="38" y="1760.7499999999995" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">ready/unusable verdict or specialist</text><text x="38" y="1801.3499999999995" font-size="28" fill="#4e6176" font-weight="400" text-anchor="start">approval.</text></g></svg>
